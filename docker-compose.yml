services:
  postgres:
    image: postgres:16-alpine
    container_name: commerceops-admin-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-commerceops_admin}
      POSTGRES_USER: ${DB_USERNAME:-commerceops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-commerceops}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:

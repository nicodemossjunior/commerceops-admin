name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Compile, test, and package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Compile application and test sources
        run: ./mvnw --batch-mode --no-transfer-progress clean test-compile -DskipTests

      - name: Run unit tests
        run: ./mvnw --batch-mode --no-transfer-progress -Dskip.integration.tests=true test

      - name: Verify Docker for Testcontainers
        run: docker info

      - name: Run integration tests
        run: ./mvnw --batch-mode --no-transfer-progress -Dskip.unit.tests=true verify

      - name: Build application package
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package

      - name: Run static analysis
        run: ./mvnw --batch-mode --no-transfer-progress checkstyle:check

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: commerceops-admin-${{ github.sha }}
          path: |
            target/*.jar
            !target/original-*.jar
          if-no-files-found: error
          retention-days: 7

  docker-build:
    name: Future Docker image build
    if: ${{ vars.ENABLE_DOCKER_BUILD == 'true' }}
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build local image without publishing
        run: docker build --tag commerceops-admin:${{ github.sha }} .

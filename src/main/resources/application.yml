spring:
  application:
    name: commerceops-admin
  profiles:
    default: local
  flyway:
    placeholders:
      activeUniquePredicate: "WHERE deleted = FALSE"
      customerEmailUniquePredicate: "WHERE deleted = FALSE AND email IS NOT NULL"
      couponCodeUniqueKeyword: "UNIQUE"

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: ${ROOT_LOG_LEVEL:INFO}
    com.commerceops.admin: ${APPLICATION_LOG_LEVEL:INFO}
  structured:
    format:
      console: ${CONSOLE_LOG_FORMAT:logstash}
    json:
      context:
        include: true
      add:
        service: ${spring.application.name}
        environment: ${APP_ENVIRONMENT:local}
      rename:
        "@timestamp": timestamp

commerceops:
  dashboard:
    low-stock-threshold: ${DASHBOARD_LOW_STOCK_THRESHOLD:10}
  security:
    jwt:
      issuer: ${JWT_ISSUER:commerceops-admin}
      secret: ${JWT_SECRET:change-me-in-local-environment}
      access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:3600}

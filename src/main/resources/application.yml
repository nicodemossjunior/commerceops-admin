spring:
  application:
    name: commerceops-admin
  profiles:
    default: local
  flyway:
    placeholders:
      activeUniquePredicate: "WHERE deleted = FALSE"
      customerEmailUniquePredicate: "WHERE deleted = FALSE AND email IS NOT NULL"

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

commerceops:
  security:
    jwt:
      issuer: ${JWT_ISSUER:commerceops-admin}
      secret: ${JWT_SECRET:change-me-in-local-environment}
      access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:3600}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/commerceops_admin}
    username: ${DB_USERNAME:commerceops}
    password: ${DB_PASSWORD:commerceops}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

logging:
  level:
    com.commerceops.admin: DEBUG
